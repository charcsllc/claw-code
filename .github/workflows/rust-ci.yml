name: Rust CI

on:
  push:
    branches:
      - main
      - 'gaebal/**'
      - 'omx-issue-*'
    paths:
      - .github/workflows/rust-ci.yml
      - .github/scripts/check_doc_source_of_truth.py
      - .github/scripts/check_release_readiness.py
      - .github/scripts/check_usage_commands.py
      - .github/FUNDING.yml
      - CODE_OF_CONDUCT.md
      - CONTRIBUTING.md
      - LICENSE
      - README.md
      - SECURITY.md
      - SUPPORT.md
      - USAGE.md
      - PARITY.md
      - PHILOSOPHY.md
      - ROADMAP.md
      - scripts/roadmap-*.sh
      - scripts/bench-startup.sh
      - tests/test_roadmap_helpers.py
      - docs/**
      - rust/**
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/rust-ci.yml
      - .github/scripts/check_doc_source_of_truth.py
      - .github/scripts/check_release_readiness.py
      - .github/scripts/check_usage_commands.py
      - .github/FUNDING.yml
      - CODE_OF_CONDUCT.md
      - CONTRIBUTING.md
      - LICENSE
      - README.md
      - SECURITY.md
      - SUPPORT.md
      - USAGE.md
      - PARITY.md
      - PHILOSOPHY.md
      - ROADMAP.md
      - scripts/roadmap-*.sh
      - scripts/bench-startup.sh
      - tests/test_roadmap_helpers.py
      - docs/**
      - rust/**
  workflow_dispatch:

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: rust

env:
  CARGO_TERM_COLOR: always

jobs:
  doc-source-of-truth:
    name: docs source-of-truth
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check docs and metadata for stale branding
        run: python .github/scripts/check_doc_source_of_truth.py
      - name: Check release policy docs and local links
        run: python .github/scripts/check_release_readiness.py
      - name: Check slash commands are documented in USAGE.md
        run: python .github/scripts/check_usage_commands.py
      - name: Check ROADMAP ids
        run: scripts/roadmap-check-ids.sh
      - name: Check ROADMAP helper behavior
        run: python -m unittest discover -s tests -p test_roadmap_helpers.py

  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Version must match rust/rust-toolchain.toml so CI clippy/rustfmt never
      # drift ahead of (or behind) local toolchains.
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - name: Check formatting
        run: cargo fmt --all --check

  test-workspace:
    name: cargo test --workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Version must match rust/rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@1.96.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - name: Run workspace tests
        run: cargo test --workspace

  clippy-workspace:
    name: cargo clippy --workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Version must match rust/rust-toolchain.toml. Pinning (instead of
      # @stable) is what keeps a brand-new clippy lint on CI from breaking
      # builds that pass locally.
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - name: Run workspace clippy
        # Same gate as CLAUDE.md's documented verification command:
        # warnings fail the build, and tests/benches are linted too.
        run: cargo clippy --workspace --all-targets -- -D warnings

  bench-startup:
    name: startup benchmark
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      # Version must match rust/rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@1.96.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - name: Build CLI for the benchmark
        working-directory: rust
        run: cargo build -p rusty-claude-cli
      - name: Benchmark startup time
        # Generous threshold: shared CI runners are slower and noisier than
        # developer machines, and this is a debug build. The gate exists to
        # catch order-of-magnitude startup regressions, not small deltas.
        env:
          CLAW_BENCH_MAX_MS: "5000"
        run: scripts/bench-startup.sh
      # NOTE: `claw design-review --output-format json` (exits 1 on findings)
      # is available as a deterministic design gate for WEB projects built or
      # improved by claw. It is intentionally NOT run against this repository:
      # claw-code is a Rust CLI with no index.html / design tokens, so the
      # audit has nothing meaningful to inspect here. Wire it into the CI of
      # generated web projects instead.

  windows-smoke:
    name: windows PowerShell smoke
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      # Version must match rust/rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@1.96.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - name: Build CLI for Windows smoke
        run: cargo build -p rusty-claude-cli
      - name: Smoke local commands without live credentials
        env:
          ANTHROPIC_API_KEY: ""
          ANTHROPIC_AUTH_TOKEN: ""
          OPENAI_API_KEY: ""
          XAI_API_KEY: ""
          DASHSCOPE_API_KEY: ""
        run: |
          $ErrorActionPreference = "Stop"
          $env:CLAW_CONFIG_HOME = Join-Path $env:RUNNER_TEMP "claw config home"
          New-Item -ItemType Directory -Force -Path $env:CLAW_CONFIG_HOME | Out-Null
          $workspace = Join-Path $env:RUNNER_TEMP "claw path smoke"
          New-Item -ItemType Directory -Force -Path $workspace | Out-Null
          $claw = Join-Path $env:GITHUB_WORKSPACE "rust\target\debug\claw.exe"
          Push-Location $workspace
          try {
            & $claw help
            & $claw status
            & $claw config env
            & $claw doctor
          } finally {
            Pop-Location
          }
