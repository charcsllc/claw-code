name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: rust

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    # No explicit toolchain step: the runner's rustup picks up
    # rust/rust-toolchain.toml (channel 1.96.1) automatically, so this job
    # always builds with the same pinned toolchain as local and rust-ci.yml.
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: rust -> target
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
