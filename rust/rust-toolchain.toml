# Single source of truth for the Rust toolchain used by local builds and CI.
# Pinned to the locally installed version so `rustup` neither downloads a new
# toolchain on developer machines nor lets CI drift ahead of local (a newer
# clippy on CI once broke the build with a lint that local clippy did not know).
#
# When bumping this version, also bump the `dtolnay/rust-toolchain@<version>`
# refs in .github/workflows/rust-ci.yml and .github/workflows/release.yml.
[toolchain]
channel = "1.96.1"
components = ["clippy", "rustfmt"]
